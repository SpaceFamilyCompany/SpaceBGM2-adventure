<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SpaceBGM</title>
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>/* APP_CSS */</style>
</head>
<body>
<main class="app">
 <section class="stage-wrap" aria-label="冒険の様子">
  <canvas id="stage" class="stage" width="256" height="144" role="img" aria-labelledby="sceneText"></canvas>
  <div class="hud">
   <p class="place"><span id="themeName">森の入口</span></p>
   <p id="saveStatus" class="save" data-state="loading">接続中</p>
  </div>
 </section>

 <section class="panel">
  <p id="sceneText" class="scene-text">はじめに、ひとつの歌があった。</p>
  <p id="marks" class="marks"></p>
  <div id="choice" class="choice" hidden>
   <p class="choice-title" id="choiceTitle">試練</p>
   <div class="choice-options" id="choiceOptions" role="radiogroup" aria-labelledby="choiceTitle"></div>
   <p class="choice-note" id="choiceNote"></p>
  </div>

  <div class="controls">
   <button id="play" class="play" type="button" aria-pressed="false" disabled><span class="play-icon" aria-hidden="true"></span><span id="playLabel">曲を準備中</span></button>
   <button id="rest" class="rest" type="button">休む</button>
   <label class="volume" for="volume"><span>音量</span><input id="volume" type="range" min="0" max="100" value="60"></label>
  </div>

  <section class="gear" aria-labelledby="gearTitle">
   <h2 id="gearTitle" class="gear-title">装備</h2>
   <div class="gear-slot">
    <span class="gear-label" id="weaponLabel">武器</span>
    <div class="gear-options" id="weaponOptions" role="radiogroup" aria-labelledby="weaponLabel"></div>
    <p class="gear-trait" id="weaponTrait"></p>
   </div>
   <div class="gear-slot">
    <span class="gear-label" id="armorLabel">防具</span>
    <div class="gear-options" id="armorOptions" role="radiogroup" aria-labelledby="armorLabel"></div>
    <p class="gear-trait" id="armorTrait"></p>
   </div>
  </section>

  <ul id="logs" class="logs" aria-label="できごと" aria-live="polite"></ul>
  <p id="error" class="error" hidden></p>
 </section>
</main>
<script>/* APP_JS */</script>
</body>
</html>
