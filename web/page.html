<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SpaceBGM</title>
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>/* APP_CSS */</style>
</head>
<body>
<!-- SPRITE_SHEET -->
<main class="app">
 <section class="stage-wrap" aria-label="冒険の様子">
  <svg id="stage" class="stage" viewBox="32 36 256 144" shape-rendering="crispEdges" role="img" aria-labelledby="sceneText">
   <g id="bgFar"><use id="far0" width="320" height="180"/><use id="far1" x="320" width="320" height="180"/></g>
   <g id="laneFar"></g>
   <g id="laneMid"></g>
   <g id="bgNear"><use id="near0" width="320" height="180"/><use id="near1" x="320" width="320" height="180"/></g>
   <g id="actors">
    <use id="owl" x="240" y="62" width="32" height="32"/>
    <use id="firefly" x="148" y="64" width="32" height="32"/>
    <use id="frog" x="232" y="142" width="32" height="32"/>
    <use id="cat" x="38" y="140" width="32" height="32"/>
    <g id="heroBack"></g>
    <use id="hero" x="72" y="138" width="32" height="32"/>
    <g id="heroFront"></g>
    <use id="foe" x="196" y="138" width="32" height="32"/>
   </g>
   <g id="laneNear"></g>
   <use id="leaves" x="258" y="150" width="32" height="32"/>
  </svg>
  <div class="hud">
   <p class="place"><b id="floorLabel" class="floor">1F</b><span id="themeName">森の入口</span></p>
   <p id="saveStatus" class="save" data-state="loading">接続中</p>
  </div>
 </section>

 <section class="panel">
  <ol id="rail" class="rail" aria-label="ダンジョンの階（曲の進行）"></ol>
  <p id="sceneText" class="scene-text">ゆっぴは蛍火の森を進んでいる。</p>

  <div class="controls">
   <button id="play" class="play" type="button" aria-pressed="false" disabled><span class="play-icon" aria-hidden="true"></span><span id="playLabel">曲を準備中</span></button>
   <button id="rest" class="rest" type="button">休む</button>
   <label class="volume" for="volume"><span>音量</span><input id="volume" type="range" min="0" max="100" value="60"></label>
  </div>

  <dl id="gear" class="gear">
   <div><dt>武器</dt><dd id="gearWeapon">なし</dd></div>
   <div><dt>防具</dt><dd id="gearArmor">なし</dd></div>
  </dl>

  <ul id="logs" class="logs" aria-label="できごと" aria-live="polite"></ul>
  <p id="error" class="error" hidden></p>
 </section>
</main>
<script>/* APP_JS */</script>
</body>
</html>
