<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SpaceBGM</title>
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>/* APP_CSS */</style>
</head>
<body>
<main class="game">
 <!-- ゲーム画面。舞台が画面いっぱいに広がり、その下にメッセージと試練のウィンドウ -->
 <section class="screen" aria-label="冒険の様子">
  <div class="stage-wrap">
   <canvas id="stage" class="stage" width="256" height="180" role="img" aria-labelledby="sceneText"></canvas>
   <div class="hud">
    <p class="place"><span id="themeName">森の入口</span></p>
    <p id="marks" class="status"></p>
   </div>
   <p id="rhythmLabel" class="rhythm" aria-live="polite"></p>
   <p id="saveStatus" class="save" data-state="loading">接続中</p>
  </div>
  <div class="window message">
   <p id="sceneText" class="scene-text">はじめに、ひとつの歌があった。</p>
   <p id="error" class="error" hidden></p>
  </div>
  <div id="choice" class="window choice" hidden>
   <p class="choice-title" id="choiceTitle">試練</p>
   <div class="choice-options" id="choiceOptions" role="radiogroup" aria-labelledby="choiceTitle"></div>
   <p class="choice-note" id="choiceNote"></p>
  </div>
 </section>

 <!-- コマンド。そうび・どうぐ・きろくは下から出るウィンドウを開く -->
 <nav class="commands" aria-label="コマンド">
  <button id="play" class="cmd play" type="button" aria-pressed="false" disabled><span class="play-icon" aria-hidden="true"></span><span id="playLabel">準備中</span></button>
  <button id="rest" class="cmd" type="button">休む</button>
  <button class="cmd" type="button" data-sheet="gearSheet" aria-expanded="false">そうび</button>
  <button class="cmd" type="button" data-sheet="itemSheet" aria-expanded="false">どうぐ</button>
  <button class="cmd" type="button" data-sheet="logSheet" aria-expanded="false">きろく</button>
 </nav>

 <section id="gearSheet" class="window sheet" hidden aria-labelledby="gearTitle">
  <header class="sheet-head"><h2 id="gearTitle">そうび</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></header>
  <p class="party" id="partyLine"></p>
  <div class="gear-slot">
   <span class="gear-label" id="weaponLabel">武器</span>
   <div class="gear-options" id="weaponOptions" role="radiogroup" aria-labelledby="weaponLabel"></div>
   <p class="gear-trait" id="weaponTrait"></p>
  </div>
  <div class="gear-slot">
   <span class="gear-label" id="armorLabel">防具</span>
   <div class="gear-options" id="armorOptions" role="radiogroup" aria-labelledby="armorLabel"></div>
   <p class="gear-trait" id="armorTrait"></p>
  </div>
 </section>

 <section id="itemSheet" class="window sheet" hidden aria-labelledby="itemTitle">
  <header class="sheet-head"><h2 id="itemTitle">どうぐ</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></header>
  <h3 class="sheet-sub">癒しの道具</h3>
  <div class="healing-items" id="healingItems"></div>
  <p class="healing-now" id="healingNow"></p>
  <h3 class="sheet-sub">音量</h3>
  <label class="volume" for="volume"><span class="visually-hidden">音量</span><input id="volume" type="range" min="0" max="100" value="60"></label>
 </section>

 <section id="logSheet" class="window sheet" hidden aria-labelledby="logTitle">
  <header class="sheet-head"><h2 id="logTitle">きろく</h2><button class="close" type="button" data-close aria-label="閉じる">×</button></header>
  <ul id="logs" class="logs" aria-live="polite"></ul>
 </section>
</main>
<script>/* APP_JS */</script>
</body>
</html>
